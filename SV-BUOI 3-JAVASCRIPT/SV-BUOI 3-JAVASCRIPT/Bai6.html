<!DOCTYPE html>

<html>
<head>
    <title>Bài 6</title>
    <meta charset="utf-8" />

    <style>

        /* ==============================
           BODY
           ============================== */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eaf2f8;
            margin: 0;
            padding: 70px 20px;
        }


        /* ==============================
           FORM
           ============================== */
        form {
            width: 500px;
            margin: auto;
        }


        /* ==============================
           TABLE
           ============================== */
        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }


        /* ==============================
           TD
           ============================== */
        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }


        /* Cột bên trái */
        td:first-child {
            width: 170px;
            font-weight: bold;
            color: #34495e;
            background: #f7f9fa;
        }


        /* Dòng cuối */
        tr:last-child td {
            border-bottom: none;
        }


        /* ==============================
           INPUT
           ============================== */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 40px;
            padding: 8px 10px;
            box-sizing: border-box;

            border: 1px solid #bbb;
            border-radius: 5px;

            font-size: 14px;
            outline: none;
        }


        /* Khi chọn ô nhập */
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.4);
        }


        /* ==============================
           GHI CHÚ
           ============================== */
        span {
            display: block;
            margin-top: 5px;
            color: #888;
            font-size: 12px;
        }


        /* ==============================
           BUTTON
           ============================== */
        td[colspan="2"] {
            background: #f7f9fa;
            padding: 20px;
        }


        input[type="submit"],
        input[type="reset"] {
            padding: 10px 25px;
            margin: 0 5px;

            border: none;
            border-radius: 5px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }


        /* Nút OK */
        input[type="submit"] {
            background: #3498db;
            color: white;
        }


        input[type="submit"]:hover {
            background: #2980b9;
        }


        /* Nút Hủy */
        input[type="reset"] {
            background: #e74c3c;
            color: white;
        }


        input[type="reset"]:hover {
            background: #c0392b;
        }

    </style>


</head>


<body>

<form action="#" method="post" name="f"
      onsubmit="return KiemTra();">

    <table>

        <!-- Tên đăng nhập -->
        <tr>
            <td>Tên đăng nhập:</td>

            <td>
                <input type="text" name="txtTDN" />

                <span>
                    (nhiều hơn 6 ký tự)
                </span>
            </td>
        </tr>


        <!-- Mật khẩu -->
        <tr>
            <td>Mật khẩu:</td>

            <td>
                <input type="password" name="txtMK" />
            </td>
        </tr>


        <!-- Xác nhận mật khẩu -->
        <tr>
            <td>Xác nhận mật khẩu:</td>

            <td>
                <input type="password" name="txtXNMK" />
            </td>
        </tr>


        <!-- Button -->
        <tr>
            <td colspan="2" align="center">

                <input
                    type="submit"
                    name="btnDN"
                    value="OK"
                />

                <input
                    type="reset"
                    name="xoa"
                    value="Hủy"
                />

            </td>
        </tr>

    </table>

</form>


</body>
</html>
