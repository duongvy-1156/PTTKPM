<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Collapse</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h3 class="mb-3">Bootstrap Collapse</h3>

        <!-- Nút mở / đóng -->
        <button class="btn btn-primary"
                data-bs-toggle="collapse"
                data-bs-target="#thongTin">
            Xem thông tin
        </button>

        <!-- Nội dung Collapse -->
        <div id="thongTin" class="collapse mt-3">

            <div class="card card-body">
                <h5>Thông tin sản phẩm</h5>

                <p>
                    Laptop có thiết kế hiện đại,
                    hiệu năng tốt và phù hợp cho học tập.
                </p>

                <p class="mb-0">
                    Giá: <strong>15.000.000 VNĐ</strong>
                </p>
            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
