<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Container</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        #width {
            color: red;
        }

        /* ≥ 576px */
        @media (min-width: 576px) {
            #width {
                color: green;
            }
        }

        /* ≥ 768px */
        @media (min-width: 768px) {
            #width {
                color: yellow;
            }
        }

        /* ≥ 992px */
        @media (min-width: 992px) {
            #width {
                color: orange;
            }
        }

        /* ≥ 1200px */
        @media (min-width: 1200px) {
            #width {
                color: purple;
            }
        }

        /* ≥ 1400px */
        @media (min-width: 1400px) {
            #width {
                color: white;
            }
        }
    </style>
</head>

<body>

    <div class="container bg-primary text-white p-4">
        <h2>.container</h2>

        <p>
            Chiều rộng hiện tại:
            <strong id="width"></strong>
        </p>
    </div>

    <script>
        function hienThiKichThuoc() {
            const container = document.querySelector(".container");
            const width = container.offsetWidth;

            document.getElementById("width").textContent = width + "px";
        }

        hienThiKichThuoc();

        window.addEventListener("resize", hienThiKichThuoc);
    </script>

</body>
</html>
