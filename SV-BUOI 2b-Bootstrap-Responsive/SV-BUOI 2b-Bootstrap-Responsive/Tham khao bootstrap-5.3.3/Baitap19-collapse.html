<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Collapse thuần</title>

    <style>
        /* ===== BUTTON ===== */
        .btn {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #0b5ed7;
        }

        /* ===== COLLAPSE ===== */
        .collapse {
            display: none;
            margin-top: 15px;
        }

        .collapse.show {
            display: block;
        }

        /* ===== CARD ===== */
        .card {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 20px;
            background-color: white;
            box-shadow: 0 2px 5px #ccc;
        }

        .card h5 {
            margin-top: 0;
        }

        .card p {
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div style="max-width: 800px; margin: 50px auto;">

        <h3>Collapse thuần HTML + CSS + JavaScript</h3>

        <!-- Nút mở / đóng -->
        <button class="btn" onclick="toggleCollapse()">
            Xem thông tin
        </button>

        <!-- Nội dung Collapse -->
        <div id="thongTin" class="collapse">

            <div class="card">

                <h5>Thông tin sản phẩm</h5>

                <p>
                    Laptop có thiết kế hiện đại,
                    hiệu năng tốt và phù hợp cho học tập.
                </p>

                <p>
                    Giá: <strong>15.000.000 VNĐ</strong>
                </p>

            </div>

        </div>

    </div>


    <script>
        function toggleCollapse() {

            const content = document.getElementById("thongTin");

            content.classList.toggle("show");

        }
    </script>

</body>

</html>
