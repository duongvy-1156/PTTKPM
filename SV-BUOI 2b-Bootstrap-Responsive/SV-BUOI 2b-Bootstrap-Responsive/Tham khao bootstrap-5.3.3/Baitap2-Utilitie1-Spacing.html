<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Spacing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h2>Ví dụ Bootstrap Spacing</h2>

        <div class="m-3 bg-primary text-white p-2">
            Margin 3 = 16px
        </div>

        <div class="mt-4 bg-success text-white p-2">
            Margin Top 4 = 24px
        </div>

        <div class="mb-5 bg-danger text-white p-2">
            Margin Bottom 5 = 48px
        </div>

    </div>

</body>
</html>
