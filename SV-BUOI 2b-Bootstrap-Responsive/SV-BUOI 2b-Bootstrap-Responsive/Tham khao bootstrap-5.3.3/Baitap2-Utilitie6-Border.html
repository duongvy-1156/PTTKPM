<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Border</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2 class="mb-4">Bootstrap Border</h2>


    <!-- 1. Border -->
    <h4>1. Thêm Border</h4>

    <div class="border p-3 mb-3">
        Border 4 phía
    </div>


    <!-- 2. Border từng phía -->
    <h4>2. Border từng phía</h4>

    <div class="border-top p-3 mb-3">
        Border Top
    </div>

    <div class="border-bottom p-3 mb-3">
        Border Bottom
    </div>

    <div class="border-start p-3 mb-3">
        Border Start
    </div>

    <div class="border-end p-3 mb-3">
        Border End
    </div>


    <!-- 3. Màu Border -->
    <h4>3. Màu Border</h4>

    <div class="border border-primary p-3 mb-3">
        Border Primary
    </div>

    <div class="border border-success p-3 mb-3">
        Border Success
    </div>

    <div class="border border-danger p-3 mb-3">
        Border Danger
    </div>

    <div class="border border-warning p-3 mb-3">
        Border Warning
    </div>


    <!-- 4. Độ dày -->
    <h4>4. Độ dày Border</h4>

    <div class="border border-1 p-3 mb-3">
        Border 1px
    </div>

    <div class="border border-3 p-3 mb-3">
        Border 3px
    </div>

    <div class="border border-5 p-3 mb-3">
        Border 5px
    </div>


    <!-- 5. Bo góc -->
    <h4>5. Bo góc</h4>

    <div class="border border-primary rounded p-3 mb-3">
        Rounded
    </div>

    <div class="border border-success rounded-3 p-3 mb-3">
        Rounded 3
    </div>

    <div class="bg-primary text-white rounded-pill p-3">
        Rounded Pill
    </div>

</div>

</body>
</html>
