<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Alerts</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="mx-auto bg-white p-4 rounded"
             style="max-width: 700px;">

            <h1 class="text-center mb-4">
                Bootstrap Alerts
            </h1>

            <!-- Success -->
            <div class="alert alert-success" role="alert">
                ✅ Thành công! Dữ liệu đã được lưu.
            </div>

            <!-- Info -->
            <div class="alert alert-info" role="alert">
                ℹ️ Thông tin: Bạn có một thông báo mới.
            </div>

            <!-- Warning -->
            <div class="alert alert-warning" role="alert">
                ⚠️ Cảnh báo! Vui lòng kiểm tra lại thông tin.
            </div>

            <!-- Danger -->
            <div class="alert alert-danger" role="alert">
                ❌ Lỗi! Không thể thực hiện thao tác.
            </div>

        </div>

    </div>

</body>

</html>
