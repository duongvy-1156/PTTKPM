<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Cards</title>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 30px;
        }

        /* ===== TIÊU ĐỀ ===== */
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* ===== CARD CONTAINER ===== */
        .cards {
            max-width: 1000px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        /* ===== CARD ===== */
        .card {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);

            transition: 0.3s;
        }

        /* Hover Card */
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        /* ===== HÌNH ẢNH ===== */
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        /* ===== NỘI DUNG ===== */
        .card-content {
            padding: 20px;
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        /* ===== GIÁ ===== */
        .price {
            color: #e63946;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* ===== BUTTON ===== */
        .btn {
            display: inline-block;

            background-color: #0d6efd;
            color: white;

            text-decoration: none;
            padding: 10px 15px;

            border-radius: 5px;
        }

        .btn:hover {
            background-color: #0b5ed7;
        }

        /* ===== TABLET ===== */
        @media (max-width: 768px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        /* ===== SMARTPHONE ===== */
        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .card img {
                height: 200px;
            }

        }
    </style>
</head>

<body>

    <h1>Sản phẩm nổi bật</h1>

    <div class="cards">

        <!-- CARD 1 -->
        <div class="card">

            <img src="https://picsum.photos/400/250?random=1"
                 alt="Laptop">

            <div class="card-content">

                <h2>Laptop ASUS</h2>

                <p>
                    Laptop hiệu năng tốt, phù hợp
                    cho học tập và làm việc.
                </p>

                <div class="price">
                    15.000.000đ
                </div>

                <a href="#" class="btn">
                    Xem chi tiết
                </a>

            </div>

        </div>


        <!-- CARD 2 -->
        <div class="card">

            <img src="https://picsum.photos/400/250?random=2"
                 alt="Laptop">

            <div class="card-content">

                <h2>Laptop Dell</h2>

                <p>
                    Thiết kế hiện đại, màn hình đẹp,
                    hoạt động ổn định.
                </p>

                <div class="price">
                    17.000.000đ
                </div>

                <a href="#" class="btn">
                    Xem chi tiết
                </a>

            </div>

        </div>


        <!-- CARD 3 -->
        <div class="card">

            <img src="https://picsum.photos/400/250?random=3"
                 alt="Laptop">

            <div class="card-content">

                <h2>Laptop Lenovo</h2>

                <p>
                    Laptop nhỏ gọn, hiệu năng tốt,
                    phù hợp cho sinh viên.
                </p>

                <div class="price">
                    14.000.000đ
                </div>

                <a href="#" class="btn">
                    Xem chi tiết
                </a>

            </div>

        </div>

    </div>

</body>

</html>
