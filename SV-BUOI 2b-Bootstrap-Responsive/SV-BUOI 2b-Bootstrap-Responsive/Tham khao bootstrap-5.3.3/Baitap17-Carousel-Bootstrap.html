<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Carousel</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- ===== CONTAINER ===== -->
    <div class="container py-5">

        <h1 class="text-center mb-4">
            Sản phẩm nổi bật
        </h1>


        <!-- ===== CAROUSEL ===== -->
        <div id="myCarousel"
             class="carousel slide"
             data-bs-ride="carousel">


            <!-- ===== INDICATORS ===== -->
            <div class="carousel-indicators">

                <button type="button"
                        data-bs-target="#myCarousel"
                        data-bs-slide-to="0"
                        class="active">
                </button>

                <button type="button"
                        data-bs-target="#myCarousel"
                        data-bs-slide-to="1">
                </button>

                <button type="button"
                        data-bs-target="#myCarousel"
                        data-bs-slide-to="2">
                </button>

            </div>


            <!-- ===== SLIDES ===== -->
            <div class="carousel-inner rounded">

                <!-- SLIDE 1 -->
                <div class="carousel-item active">

                    <img src="https://picsum.photos/1200/500?random=1"
                         class="d-block w-100"
                         alt="Laptop ASUS">

                    <div class="carousel-caption">

                        <h3>Laptop ASUS</h3>

                        <p>
                            Hiệu năng tốt cho học tập và làm việc.
                        </p>

                    </div>

                </div>


                <!-- SLIDE 2 -->
                <div class="carousel-item">

                    <img src="https://picsum.photos/1200/500?random=2"
                         class="d-block w-100"
                         alt="Laptop Dell">

                    <div class="carousel-caption">

                        <h3>Laptop Dell</h3>

                        <p>
                            Thiết kế hiện đại, hoạt động ổn định.
                        </p>

                    </div>

                </div>


                <!-- SLIDE 3 -->
                <div class="carousel-item">

                    <img src="https://picsum.photos/1200/500?random=3"
                         class="d-block w-100"
                         alt="Laptop Lenovo">

                    <div class="carousel-caption">

                        <h3>Laptop Lenovo</h3>

                        <p>
                            Nhỏ gọn, phù hợp cho sinh viên.
                        </p>

                    </div>

                </div>

            </div>


            <!-- ===== PREVIOUS ===== -->
            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#myCarousel"
                    data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

                <span class="visually-hidden">
                    Previous
                </span>

            </button>


            <!-- ===== NEXT ===== -->
            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#myCarousel"
                    data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

                <span class="visually-hidden">
                    Next
                </span>

            </button>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
