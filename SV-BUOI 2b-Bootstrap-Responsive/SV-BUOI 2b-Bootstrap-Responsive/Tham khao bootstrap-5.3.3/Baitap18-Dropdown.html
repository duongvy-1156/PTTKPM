<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dropdown thuần</title>

    <style>

        /* ===== DROPDOWN ===== */

        .dropdown {
            position: relative;
            display: inline-block;
        }


        /* ===== BUTTON ===== */

        .dropdown-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;

            background-color: #0d6efd;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }


        .dropdown-btn:hover {
            background-color: #0b5ed7;
        }


        /* ===== MENU ===== */

        .dropdown-menu {
            display: none;

            position: absolute;
            top: 100%;
            left: 0;

            min-width: 160px;

            margin-top: 5px;
            padding: 5px 0;

            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.15);

            list-style: none;
        }


        /* ===== ITEM ===== */

        .dropdown-menu a {
            display: block;

            padding: 10px 15px;

            color: #333;
            text-decoration: none;
        }


        .dropdown-menu a:hover {
            background-color: #f1f1f1;
        }


        /* ===== HIỆN MENU ===== */

        .dropdown:hover .dropdown-menu {
            display: block;
        }

    </style>

</head>


<body>

    <div style="margin: 50px;">

        <h3>Dropdown thuần CSS</h3>


        <div class="dropdown">

            <button class="dropdown-btn">
                Danh mục ▼
            </button>


            <ul class="dropdown-menu">

                <li>
                    <a href="#">
                        Laptop
                    </a>
                </li>

                <li>
                    <a href="#">
                        Điện thoại
                    </a>
                </li>

                <li>
                    <a href="#">
                        Máy tính
                    </a>
                </li>

            </ul>

        </div>

    </div>

</body>

</html>
