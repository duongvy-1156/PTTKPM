<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modal Responsive</title>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 30px;
        }

        /* ===== BUTTON ===== */
        .open-btn {
            display: block;
            margin: 100px auto;

            padding: 12px 20px;
            border: none;
            border-radius: 6px;

            background-color: #0d6efd;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        .open-btn:hover {
            background-color: #0b5ed7;
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;

            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color: rgba(0, 0, 0, 0.5);

            justify-content: center;
            align-items: center;
        }

        /* Hiện Modal */
        .modal:target {
            display: flex;
        }

        /* ===== MODAL CONTENT ===== */
        .modal-content {
            width: 500px;
            max-width: 90%;

            background-color: white;
            border-radius: 10px;

            padding: 25px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* ===== HEADER ===== */
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 22px;
        }

        .close {
            color: #555;
            font-size: 28px;
            text-decoration: none;
        }

        .close:hover {
            color: #dc3545;
        }

        /* ===== BODY ===== */
        .modal-body {
            color: #555;
            line-height: 1.6;
        }

        /* ===== FOOTER ===== */
        .modal-footer {
            text-align: right;
            margin-top: 20px;
        }

        .close-btn {
            display: inline-block;

            padding: 10px 18px;

            background-color: #6c757d;
            color: white;

            text-decoration: none;
            border-radius: 5px;
        }

        .close-btn:hover {
            background-color: #5c636a;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .modal-content {
                width: 90%;
                padding: 20px;
            }

            .modal-header h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== NÚT MỞ MODAL ===== -->
    <a href="#modal" class="open-btn">
        Mở Modal
    </a>


    <!-- ===== MODAL ===== -->
    <div id="modal" class="modal">

        <div class="modal-content">

            <!-- Header -->
            <div class="modal-header">

                <h2>Thông báo</h2>

                <a href="#" class="close">
                    ×
                </a>

            </div>

            <!-- Body -->
            <div class="modal-body">

                <p>
                    Đây là nội dung của Modal.
                    Modal có thể dùng để hiển thị
                    thông tin hoặc yêu cầu xác nhận.
                </p>

            </div>

            <!-- Footer -->
            <div class="modal-footer">

                <a href="#" class="close-btn">
                    Đóng
                </a>

            </div>

        </div>

    </div>

</body>

</html>
