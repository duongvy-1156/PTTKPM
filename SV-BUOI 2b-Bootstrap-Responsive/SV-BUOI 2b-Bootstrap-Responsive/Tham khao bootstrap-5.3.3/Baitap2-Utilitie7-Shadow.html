<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Shadow màu</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        /* Bóng màu xanh */
        .shadow-blue {
            box-shadow: 0 0 15px rgba(13, 110, 253, 0.7);
        }

        /* Bóng màu xanh lá */
        .shadow-green {
            box-shadow: 0 0 15px rgba(25, 135, 84, 0.7);
        }

        /* Bóng màu đỏ */
        .shadow-red {
            box-shadow: 0 0 15px rgba(220, 53, 69, 0.7);
        }

        /* Bóng màu vàng */
        .shadow-yellow {
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.7);
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">
        5.1. Shadow màu trong Bootstrap
    </h2>

    <!-- Bóng xanh -->
    <div class="border border-primary p-4 mb-4 shadow-blue">
        <h5 class="text-primary">Shadow màu xanh</h5>
        <p>Bóng màu xanh dương</p>
    </div>

    <!-- Bóng xanh lá -->
    <div class="border border-success p-4 mb-4 shadow-green">
        <h5 class="text-success">Shadow màu xanh lá</h5>
        <p>Bóng màu xanh lá</p>
    </div>

    <!-- Bóng đỏ -->
    <div class="border border-danger p-4 mb-4 shadow-red">
        <h5 class="text-danger">Shadow màu đỏ</h5>
        <p>Bóng màu đỏ</p>
    </div>

    <!-- Bóng vàng -->
    <div class="border border-warning p-4 mb-4 shadow-yellow">
        <h5 class="text-warning">Shadow màu vàng</h5>
        <p>Bóng màu vàng</p>
    </div>

</div>

</body>
</html>
