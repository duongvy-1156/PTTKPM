<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Padding</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h2>Ví dụ Bootstrap Padding</h2>

        <div class="p-1 bg-primary text-white mb-3">
            Padding 1 = 4px
        </div>

        <div class="p-2 bg-success text-white mb-3">
            Padding 2 = 8px
        </div>

        <div class="p-3 bg-danger text-white mb-3">
            Padding 3 = 16px
        </div>

        <div class="p-4 bg-warning text-dark mb-3">
            Padding 4 = 24px
        </div>

        <div class="p-5 bg-info text-dark">
            Padding 5 = 48px
        </div>

    </div>

</body>
</html>
