<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Forms Responsive</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <form class="bg-white p-4 rounded shadow-sm mx-auto"
              style="max-width: 700px;">

            <h1 class="text-center mb-4">
                Đăng ký
            </h1>


            <!-- GRID -->
            <div class="row g-3">

                <!-- HỌ TÊN -->
                <div class="col-md-6">

                    <label for="name" class="form-label">
                        Họ tên
                    </label>

                    <input type="text"
                           id="name"
                           class="form-control"
                           placeholder="Nhập họ tên">

                </div>


                <!-- EMAIL -->
                <div class="col-md-6">

                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           class="form-control"
                           placeholder="Nhập email">

                </div>


                <!-- MẬT KHẨU -->
                <div class="col-md-6">

                    <label for="password" class="form-label">
                        Mật khẩu
                    </label>

                    <input type="password"
                           id="password"
                           class="form-control"
                           placeholder="Nhập mật khẩu">

                </div>


                <!-- GIỚI TÍNH -->
                <div class="col-md-6">

                    <label class="form-label">
                        Giới tính
                    </label>

                    <div>

                        <div class="form-check form-check-inline">

                            <input class="form-check-input"
                                   type="radio"
                                   name="gender"
                                   id="male">

                            <label class="form-check-label"
                                   for="male">
                                Nam
                            </label>

                        </div>


                        <div class="form-check form-check-inline">

                            <input class="form-check-input"
                                   type="radio"
                                   name="gender"
                                   id="female">

                            <label class="form-check-label"
                                   for="female">
                                Nữ
                            </label>

                        </div>

                    </div>

                </div>


                <!-- NỘI DUNG -->
                <div class="col-12">

                    <label for="message" class="form-label">
                        Nội dung
                    </label>

                    <textarea id="message"
                              class="form-control"
                              rows="4"
                              placeholder="Nhập nội dung..."></textarea>

                </div>


                <!-- BUTTON -->
                <div class="col-12">

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Đăng ký
                    </button>

                </div>

            </div>

        </form>

    </div>

</body>

</html>
