<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Progress</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h2 class="text-center mb-4">
            Tiến độ công việc
        </h2>

        <!-- Progress 1 -->
        <div class="mb-4">
            <div class="d-flex justify-content-between mb-1">
                <span>HTML</span>
                <span>90%</span>
            </div>

            <div class="progress">
                <div class="progress-bar"
                     style="width: 90%;">
                    90%
                </div>
            </div>
        </div>


        <!-- Progress 2 -->
        <div class="mb-4">
            <div class="d-flex justify-content-between mb-1">
                <span>CSS</span>
                <span>80%</span>
            </div>

            <div class="progress">
                <div class="progress-bar bg-success"
                     style="width: 80%;">
                    80%
                </div>
            </div>
        </div>


        <!-- Progress 3 -->
        <div class="mb-4">
            <div class="d-flex justify-content-between mb-1">
                <span>JavaScript</span>
                <span>65%</span>
            </div>

            <div class="progress">
                <div class="progress-bar bg-warning"
                     style="width: 65%;">
                    65%
                </div>
            </div>
        </div>


        <!-- Progress 4 -->
        <div class="mb-4">
            <div class="d-flex justify-content-between mb-1">
                <span>Bootstrap</span>
                <span>75%</span>
            </div>

            <div class="progress">
                <div class="progress-bar bg-info"
                     style="width: 75%;">
                    75%
                </div>
            </div>
        </div>


        <!-- Progress 5 -->
        <div class="mb-4">
            <div class="d-flex justify-content-between mb-1">
                <span>Hoàn thành dự án</span>
                <span>100%</span>
            </div>

            <div class="progress">
                <div class="progress-bar bg-danger"
                     style="width: 100%;">
                    100%
                </div>
            </div>
        </div>


        <!-- Progress có sọc -->
        <h4 class="mt-5 mb-3">
            Progress có hiệu ứng
        </h4>

        <div class="progress mb-3">
            <div class="progress-bar progress-bar-striped"
                 style="width: 60%;">
                60%
            </div>
        </div>


        <!-- Progress chạy -->
        <div class="progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated"
                 style="width: 70%;">
                Đang xử lý 70%
            </div>
        </div>

    </div>

</body>

</html>
