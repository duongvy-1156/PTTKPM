<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Grid System</title>

    <style>
        /* =========================
           GRID SYSTEM - DESKTOP
           ========================= */
        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .item {
            background: #0d6efd;
            color: white;
            padding: 40px 20px;
            text-align: center;
            font-size: 20px;
            border-radius: 8px;
        }

        /* =========================
           TABLET
           ≤ 991px
           ========================= */
        @media (max-width: 991px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* =========================
           SMARTPHONE
           ≤ 575px
           ========================= */
        @media (max-width: 575px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Grid System</h1>

    <div class="container">

        <div class="item">Sản phẩm 1</div>
        <div class="item">Sản phẩm 2</div>
        <div class="item">Sản phẩm 3</div>
        <div class="item">Sản phẩm 4</div>

        <div class="item">Sản phẩm 5</div>
        <div class="item">Sản phẩm 6</div>
        <div class="item">Sản phẩm 7</div>
        <div class="item">Sản phẩm 8</div>

    </div>

</body>

</html>
