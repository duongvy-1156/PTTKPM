<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Grid System</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">
            Bootstrap Grid System
        </h2>

        <div class="row g-3">

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-primary text-white text-center p-4 rounded">
                    Sản phẩm 1
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-success text-white text-center p-4 rounded">
                    Sản phẩm 2
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-danger text-white text-center p-4 rounded">
                    Sản phẩm 3
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-warning text-dark text-center p-4 rounded">
                    Sản phẩm 4
                </div>
            </div>

        </div>

    </div>

</body>

</html>
