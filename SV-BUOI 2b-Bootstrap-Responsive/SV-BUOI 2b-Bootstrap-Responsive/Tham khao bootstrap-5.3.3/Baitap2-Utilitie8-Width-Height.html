<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Width và Height</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h2>Width và Height trong Bootstrap</h2>

        <!-- WIDTH -->
        <h4 class="mt-4">Width</h4>

        <div class="w-25 bg-primary text-white p-2 mb-2">
            Width 25%
        </div>

        <div class="w-50 bg-success text-white p-2 mb-2">
            Width 50%
        </div>

        <div class="w-75 bg-warning p-2 mb-2">
            Width 75%
        </div>

        <div class="w-100 bg-danger text-white p-2 mb-2">
            Width 100%
        </div>


        <!-- HEIGHT -->
        <h4 class="mt-4">Height</h4>

        <div style="height: 200px;" class="border">

            <div class="h-25 bg-primary text-white p-2">
                Height 25%
            </div>

        </div>

    </div>

</body>
</html>
