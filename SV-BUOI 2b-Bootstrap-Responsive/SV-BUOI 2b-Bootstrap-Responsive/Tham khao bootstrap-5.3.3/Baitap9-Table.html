<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Tables</title>

    <style>

        /* =========================
           BODY
        ========================= */

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }


        /* =========================
           TABLE CONTAINER
        ========================= */

        .table-container {
            width: 100%;
            overflow-x: auto;
        }


        /* =========================
           TABLE
        ========================= */

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }


        /* =========================
           TH VÀ TD
        ========================= */

        th,
        td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }


        /* =========================
           TABLE HEADER
        ========================= */

        th {
            background-color: #333;
            color: white;
        }


        /* =========================
           DÒNG XEN KẼ
        ========================= */

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }


        /* =========================
           HOVER
        ========================= */

        tr:hover {
            background-color: #ddd;
        }


        /* =========================
           CĂN CHỈNH
        ========================= */

        .left {
            text-align: left;
        }

        .right {
            text-align: right;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            body {
                margin: 15px;
            }

            table {
                min-width: 600px;
            }

            th,
            td {
                padding: 8px;
                font-size: 14px;
            }
        }


        /* =========================
           SMARTPHONE
        ========================= */

        @media (max-width: 480px) {

            h1 {
                font-size: 24px;
            }

            th,
            td {
                padding: 6px;
                font-size: 13px;
            }
        }

    </style>

</head>


<body>

    <h1>Danh sách sinh viên</h1>


    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>STT</th>

                    <th>Lớp</th>

                </tr>

            </thead>


            <tbody>

                <tr>
                    <td>1</td>
                    <td class="left">Nguyễn Văn An</td>
                    <td>CNTT01</td>
                    <td>8.5</td>
                    <td>Giỏi</td>
                </tr>


                <tr>
                    <td>2</td>
                    <td class="left">Trần Văn Bình</td>
                    <td>CNTT01</td>
                    <td>9.0</td>
                    <td>Giỏi</td>
                </tr>


                <tr>
                    <td>3</td>
                    <td class="left">Lê Thị Hoa</td>
                    <td>CNTT02</td>
                    <td>7.5</td>
                    <td>Khá</td>
                </tr>


                <tr>
                    <td>4</td>
                    <td class="left">Phạm Văn Nam</td>
                    <td>CNTT02</td>
                    <td>6.5</td>
                    <td>Khá</td>
                </tr>


                <tr>
                    <td>5</td>
                    <td class="left">Nguyễn Thị Lan</td>
                    <td>CNTT03</td>

                    <td>Xuất sắc</td>
                </tr>


                <tr>
                    <td>6</td>

                </tr>

            </tbody>

        </table>

    </div>


</body>

</html>
