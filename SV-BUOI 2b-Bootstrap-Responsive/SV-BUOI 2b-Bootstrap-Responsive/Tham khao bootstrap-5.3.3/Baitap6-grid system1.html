<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grid System</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .item {
            background: steelblue;
            color: white;
            padding: 30px;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h2>Grid System</h2>

    <div class="container">

        <div class="item">Sản phẩm 1</div>
        <div class="item">Sản phẩm 2</div>
        <div class="item">Sản phẩm 3</div>
        <div class="item">Sản phẩm 4</div>

        <div class="item">Sản phẩm 5</div>
        <div class="item">Sản phẩm 6</div>
        <div class="item">Sản phẩm 7</div>
        <div class="item">Sản phẩm 8</div>

    </div>

</body>

</html>
