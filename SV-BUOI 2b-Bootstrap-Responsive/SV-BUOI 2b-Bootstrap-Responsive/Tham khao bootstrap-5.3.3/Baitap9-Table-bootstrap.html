<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Tables</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <!-- TIÊU ĐỀ -->
        <h1 class="text-center mb-4">
            Danh sách sinh viên
        </h1>


        <!-- TABLE RESPONSIVE -->
        <div class="table-responsive">

            <table class="table table-bordered table-striped table-hover bg-white">

                <!-- HEADER -->
                <thead class="table-dark">

                    <tr>
                        <th class="text-center">STT</th>
                        <th>Họ tên</th>
                        <th class="text-center">Lớp</th>
                        <th class="text-center">Điểm</th>
                        <th class="text-center">Xếp loại</th>
                    </tr>

                </thead>


                <!-- BODY -->
                <tbody>

                    <tr>
                        <td class="text-center">1</td>
                        <td>Nguyễn Văn An</td>
                        <td class="text-center">CNTT01</td>
                        <td class="text-center">8.5</td>
                        <td class="text-center">Giỏi</td>
                    </tr>

                    <tr>
                        <td class="text-center">2</td>
                        <td>Trần Văn Bình</td>
                        <td class="text-center">CNTT01</td>
                        <td class="text-center">9.0</td>
                        <td class="text-center">Giỏi</td>
                    </tr>

                    <tr>
                        <td class="text-center">3</td>
                        <td>Lê Thị Hoa</td>
                        <td class="text-center">CNTT02</td>
                        <td class="text-center">7.5</td>
                        <td class="text-center">Khá</td>
                    </tr>

                    <tr>
                        <td class="text-center">4</td>
                        <td>Phạm Văn Nam</td>
                        <td class="text-center">CNTT02</td>
                        <td class="text-center">6.5</td>
                        <td class="text-center">Khá</td>
                    </tr>

                    <tr>
                        <td class="text-center">5</td>
                        <td>Nguyễn Thị Lan</td>
                        <td class="text-center">CNTT03</td>
                        <td class="text-center">9.5</td>
                        <td class="text-center">Xuất sắc</td>
                    </tr>

                    <tr>
                        <td class="text-center">6</td>
                        <td>Hoàng Văn Minh</td>
                        <td class="text-center">CNTT03</td>
                        <td class="text-center">5.5</td>
                        <td class="text-center">Trung bình</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
